name: Runtime portability
on: [push, pull_request]
permissions:
  contents: read
jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./internal/runtime ./internal/recovery
      - run: go test ./internal/cli -run 'TestBuildInfoDoesNotNeedProject|TestInitDerivesHookMetadataAndCreatesJournals'
