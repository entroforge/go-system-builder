name: Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild and upload assets for
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest

    # Configure required reviewers for the `release` environment in GitHub
    # repository settings when a human release approval is desired.
    environment:
      name: release

    permissions:
      contents: write

    env:
      VERSION: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Initialize local runtime
        run: go run ./cmd/loop-harness init --root .

      - name: Validate version
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

      - name: Verify
        run: make ci-verify

      - name: Build release package
        run: make release-checksum VERSION="$VERSION"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            "dist/vibe-coding-loop-template-$VERSION.tar.gz" \
            "dist/sha256sums-$VERSION.txt"
