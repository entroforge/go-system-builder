name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest

    # Configure required reviewers for the `release` environment in GitHub
    # repository settings when a human release approval is desired.
    environment:
      name: release

    permissions:
      contents: write

    env:
      VERSION: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Initialize local runtime
        run: go run ./cmd/loop-harness init --root .

      - name: Validate version
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

      - name: Verify
        run: make ci-verify

      - name: Build release package
        run: make release-checksum VERSION="$VERSION"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "go-system-builder $VERSION" \
            --generate-notes \
            "dist/vibe-coding-loop-template-$VERSION.tar.gz" \
            "dist/sha256sums-$VERSION.txt"
