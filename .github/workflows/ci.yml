name: CI

on:
  workflow_dispatch:
    inputs:
      full:
        description: Run all scenarios, full race coverage and release installation checks
        type: boolean
        default: false
  pull_request:
    branches:
      - main
      - integration/loop-next
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.full == true && 'full' || 'pr' }}
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ inputs.full != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Initialize local runtime
        run: go run ./cmd/loop-harness init --root .

      - name: Verify PR checks
        run: make ci-verify

  full:
    if: ${{ inputs.full == true }}
    uses: ./.github/workflows/full-verification.yml
    with:
      ref: ${{ github.sha }}
      job_timeout_minutes: 120
