name: CI

on:
  workflow_dispatch:
    inputs:
      full:
        description: Run all scenarios, full race coverage and release installation checks
        type: boolean
        default: false
  pull_request:
    branches:
      - main
      - integration/loop-next
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.full == true && 'full' || 'pr' }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.full == true && 120 || 15 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Initialize local runtime
        run: go run ./cmd/loop-harness init --root .

      - name: Verify PR checks
        if: ${{ inputs.full != true }}
        run: make ci-verify

      - name: Verify complete suite and release installation
        if: ${{ inputs.full == true }}
        run: make ci-verify-full
